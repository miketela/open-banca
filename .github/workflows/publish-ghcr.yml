# Build and push open-banca images to GHCR.
# Trigger: manual (workflow_dispatch) or tag v*.*.*
# Does NOT push on PR — operator runs workflow_dispatch or tags a release.

name: Publish GHCR

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push images to GHCR (false = build only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}
  IMAGE_SANDBOX: ghcr.io/${{ github.repository }}-sandbox

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event.inputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (api)
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build open-banca (api + worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: ${{ github.event_name == 'push' || github.event.inputs.push == 'true' }}
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker metadata (sandbox)
        id: meta_sandbox
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_SANDBOX }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sandbox-

      - name: Build open-banca-sandbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./sandbox/Dockerfile
          push: ${{ github.event_name == 'push' || github.event.inputs.push == 'true' }}
          tags: ${{ steps.meta_sandbox.outputs.tags }}
          labels: ${{ steps.meta_sandbox.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### GHCR publish" >> "$GITHUB_STEP_SUMMARY"
          echo "- API image: \`${{ env.IMAGE_API }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sandbox image: \`${{ env.IMAGE_SANDBOX }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" == "push" || "${{ github.event.inputs.push }}" == "true" ]]; then
            echo "- **Pushed** to GHCR" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Build only** (no push)" >> "$GITHUB_STEP_SUMMARY"
          fi
