name: CI

on:
  pull_request:
    branches: ["develop", "main"]
  push:
    branches: ["develop", "main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: Lint / Type-check / Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
      fail-fast: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type-check (pyrefly)
        run: uv run pyrefly check

      - name: Run tests (unit + integration, no live, no canary)
        run: uv run pytest -m "not live and not canary" -q

  canary-gate:
    name: Canary Security Gate (REQ-016)
    runs-on: ubuntu-latest
    needs: lint-type-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Run canary tests (secrets must never leak)
        # Any canary test failure means a secret/PII would appear in logs/OTel/HAR.
        # This gate is all-or-nothing: a single failure fails the whole CI.
        run: uv run pytest -m canary -q

  docker-compose-validate:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    needs: lint-type-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.dev.yml
        run: docker compose -f docker-compose.dev.yml config --quiet

      - name: Validate docker-compose.yml
        env:
          # Placeholders solo para `docker compose config` (sintaxis/interpolación).
          # Producción sigue exigiendo valores reales vía .env (ver .env.example).
          TEMPORAL_DB_PASSWORD: ci-validate-placeholder
          OPEN_BANCA_MASTER_PASSPHRASE: ci-validate-placeholder
          WEBHOOK_HMAC_SECRET: ci-validate-placeholder
          API_KEY: ci-validate-placeholder
          ANTHROPIC_API_KEY: ci-validate-placeholder
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose -f docker-compose.yml config --quiet
          else
            echo "docker-compose.yml not found, skipping."
          fi

  compose-smoke:
    name: Docker Compose smoke (optional)
    runs-on: ubuntu-latest
    needs: lint-type-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Run scripts/smoke_compose.sh when Docker is available
        env:
          TEMPORAL_DB_PASSWORD: ci-smoke-temporal-db
          OPEN_BANCA_MASTER_PASSPHRASE: ci-smoke-master-passphrase-32chars-min_
          WEBHOOK_HMAC_SECRET: ci-smoke-webhook-hmac-secret-hex-placeholder-
          API_KEY: ci-smoke-api-key
          ANTHROPIC_API_KEY: ci-smoke-anthropic-placeholder
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker CLI not installed — skipping compose smoke"
            exit 0
          fi
          if ! docker info >/dev/null 2>&1; then
            echo "Docker daemon unavailable — skipping compose smoke"
            exit 0
          fi
          bash scripts/smoke_compose.sh
