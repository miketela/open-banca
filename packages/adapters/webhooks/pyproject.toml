[project]
name = "open-banca-webhooks"
version = "0.1.0"
description = "Webhook dispatcher: HMAC-SHA256 signing, outbox, retry, DLQ"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "open-banca-domain",
    "open-banca-storage",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_banca_webhooks"]

[tool.uv.sources]
open-banca-domain = { workspace = true }
open-banca-storage = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PL", "ANN"]
ignore = ["PLR2004", "PLR0912", "PLR0915", "ANN401"]
per-file-ignores = { "tests/**" = ["ANN", "S101", "RUF100", "B017"] }
