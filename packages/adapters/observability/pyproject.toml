[project]
name = "open-banca-observability"
version = "0.1.0"
description = "Observability adapter: OTel and Langfuse providers"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }
dependencies = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
]

[project.optional-dependencies]
langfuse = [
    "langfuse>=2.50,<3",
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_banca_observability"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "canary: CI security gate — secrets/PII must never appear in logs/HAR/OTel (REQ-016)",
    "unit: fast unit tests with no external dependencies",
    "integration: tests requiring external services",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PL"]
ignore = ["PLR2004", "PLR0912", "PLR0915", "E501", "PLC0415"]
