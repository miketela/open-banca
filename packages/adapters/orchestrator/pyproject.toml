[project]
name = "open-banca-orchestrator"
version = "0.1.0"
description = "Orchestrator adapter: Temporal workflows and activities"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }
dependencies = [
    "temporalio>=1.7",
    "pydantic>=2",
    "pydantic-settings>=2",
    "open-banca-domain",
    "open-banca-webhooks",
    "open-banca-observability",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_banca_orchestrator"]

[tool.uv.sources]
open-banca-domain = { workspace = true }
open-banca-webhooks = { workspace = true }
open-banca-observability = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PL"]
ignore = ["PLR2004", "PLR0912", "PLR0915"]
