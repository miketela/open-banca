[project]
name = "open-banca-api"
version = "0.1.0"
description = "API adapter: FastAPI request/response, HMAC signer"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "slowapi>=0.1.9",
    "httpx>=0.27.0",
    "open-banca-domain",
    "open-banca-application",
    "open-banca-storage",
    "open-banca-orchestrator",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.27.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_banca_api"]

[tool.uv.sources]
open-banca-domain = { workspace = true }
open-banca-application = { workspace = true }
open-banca-storage = { workspace = true }
open-banca-orchestrator = { workspace = true }
