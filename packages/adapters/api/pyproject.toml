[project]
name = "open-banca-api"
version = "0.1.0"
description = "API adapter: FastAPI request/response, HMAC signer"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_banca_api"]
