[project]
name = "open-banca-browser"
version = "0.1.0"
description = "Browser adapter: Playwright scraper runner (zero LLM)"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }
dependencies = [
    "playwright>=1.49",
    "pydantic>=2",
    "open-banca-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_banca_browser"]

[tool.uv.sources]
open-banca-domain = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]
