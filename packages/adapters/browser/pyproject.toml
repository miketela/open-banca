[project]
name = "open-banca-browser"
version = "0.1.0"
description = "Browser adapter: browser-use wrapper and Playwright runner"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_banca_browser"]
