[project]
name = "open-banca-sandbox"
version = "0.1.0"
description = "Sandbox adapter: Docker per-job execution wrapper"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_banca_sandbox"]
