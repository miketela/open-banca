[project]
name = "open-banca-sandbox"
version = "0.1.0"
description = "Sandbox adapter: Docker per-job execution wrapper"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7",
    "open-banca-domain",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.21.0",
]

[tool.uv.sources]
open-banca-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_banca_sandbox"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PL"]
ignore = ["PLR2004", "PLR0912", "PLR0915", "E501", "PLC0415"]
