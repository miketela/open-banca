[project]
name = "open-banca-llm"
version = "0.1.0"
description = "LLM adapter: PydanticAI integration and LiteLLM client"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_banca_llm"]
