[project]
name = "open-banca-schemas"
version = "0.1.0"
description = "Shared Pydantic schemas: cross-package request/response models and events"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_banca_schemas"]
