[project]
name = "open-banca-cli"
version = "0.1.0"
description = "CLI for managing open-banca credentials and vault operations"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "open-banca-storage",
    "open-banca-application",
    "open-banca-domain",
]

[project.scripts]
open-banca = "open_banca_cli.main:app"

[tool.uv.sources]
open-banca-storage = { workspace = true }
open-banca-application = { workspace = true }
open-banca-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_banca_cli"]
