[project]
name = "open-banca-application"
version = "0.1.0"
description = "Application layer: use cases, depends only on domain"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }
dependencies = [
    "open-banca-domain",
    "pydantic>=2.7",
]

[tool.uv.sources]
open-banca-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_banca_application"]
