[project]
name = "open-banca-application"
version = "0.1.0"
requires-python = ">=3.12"
description = "Application use cases for open-banca"
dependencies = [
    "open-banca-domain",
]

[tool.uv.sources]
open-banca-domain = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "pyrefly>=0.18",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_banca_application"]
