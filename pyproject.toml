[project]
name = "open-banca"
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"

[tool.uv.workspace]
members = ["packages/domain", "packages/application"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"**/tests/**" = ["ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/domain/tests", "packages/application/tests"]
