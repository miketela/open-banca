repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: pyrefly-check
        name: pyrefly type check
        entry: uv run pyrefly check
        language: system
        pass_filenames: false
        types: [python]
