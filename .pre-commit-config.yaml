repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: pyrefly-check
        name: pyrefly type check
        entry: uv run pyrefly check
        language: system
        pass_filenames: false
        types: [python]

      - id: har-sanitizer-gate
        name: HAR sanitizer gate (block raw credentials in staged HAR files)
        language: python
        entry: python -c |
          import sys, re, json, pathlib
          # Secret patterns that must not appear in committed HAR files.
          FORBIDDEN = [
              re.compile(r'SECRET_CANARY_VALUE', re.IGNORECASE),
              re.compile(r'PII_CANARY_[A-Z0-9_]+', re.IGNORECASE),
              re.compile(r'"Authorization"\s*:\s*"(?!REDACTED)[^"]+', re.IGNORECASE),
              re.compile(r'"Cookie"\s*:\s*"(?!REDACTED)[^"]+', re.IGNORECASE),
              re.compile(r'"Set-Cookie"\s*:\s*"(?!REDACTED)[^"]+', re.IGNORECASE),
              re.compile(r'"(?:password|token|session)"\s*:\s*"(?!REDACTED)[^"]+', re.IGNORECASE),
          ]
          RAW_PATH_RE = re.compile(r'[\\/]raw[\\/]')
          failed = False
          for p in sys.argv[1:]:
              path = pathlib.Path(p)
              if RAW_PATH_RE.search(str(path)):
                  print(f'ERROR: refusing to commit HAR from raw/ directory: {p}', file=sys.stderr)
                  failed = True
                  continue
              try:
                  content = path.read_text(encoding='utf-8', errors='replace')
              except Exception as e:
                  print(f'WARNING: could not read {p}: {e}', file=sys.stderr)
                  continue
              for pat in FORBIDDEN:
                  if pat.search(content):
                      print(f'ERROR: {p} contains unsanitized secret pattern: {pat.pattern}', file=sys.stderr)
                      failed = True
                      break
          sys.exit(1 if failed else 0)
        files: \.har$
        pass_filenames: true
