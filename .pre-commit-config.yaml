repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
        args: ["--unsafe"]
      - id: end-of-file-fixer
        types: [python]
      - id: trailing-whitespace
        types: [python]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: uv\.lock|\.secrets\.baseline

  - repo: local
    hooks:
      - id: pyrefly-check
        name: pyrefly type check
        entry: uv run pyrefly check
        language: system
        pass_filenames: false
        types: [python]

      - id: har-sanitizer-gate
        name: HAR sanitizer gate (block raw credentials in staged HAR files)
        entry: python scripts/har_sanitizer_gate.py
        language: python
        files: \.har$
        pass_filenames: true
